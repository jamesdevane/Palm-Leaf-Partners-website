<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Our World — Palm Leaf Partners</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020408; font-family: 'Georgia', serif; }
    #canvas-container { position: fixed; inset: 0; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      background: linear-gradient(to bottom, rgba(2,4,8,0.9) 0%, rgba(2,4,8,0) 100%);
    }
    .top-bar .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .top-bar .logo img { height: 40px; width: 40px; border-radius: 50%; }
    .top-bar .logo-text { line-height: 1.1; }
    .top-bar .logo-text .name { font-size: 1rem; font-weight: 700; color: #F5F0E8; letter-spacing: 0.05em; }
    .top-bar .logo-text .sub { font-size: 0.6rem; font-weight: 600; color: #B8860B; letter-spacing: 0.18em; text-transform: uppercase; }
    .top-bar .back-btn {
      color: rgba(245,240,232,0.7); font-size: 0.82rem; font-weight: 500;
      text-decoration: none; letter-spacing: 0.06em;
      border: 1px solid rgba(184,134,11,0.4); padding: 0.4rem 1rem;
      border-radius: 20px; transition: all 0.2s;
    }
    .top-bar .back-btn:hover { color: #B8860B; border-color: #B8860B; }

    .info-panel {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 100; text-align: center; pointer-events: none;
    }
    .info-panel .country-name {
      font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; color: #F5F0E8;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      opacity: 0; transform: translateY(10px); transition: all 0.4s ease;
    }
    .info-panel .country-name.visible { opacity: 1; transform: translateY(0); }
    .info-panel .country-sub {
      font-size: 0.8rem; color: #B8860B; letter-spacing: 0.15em;
      text-transform: uppercase; margin-top: 0.25rem;
      opacity: 0; transition: all 0.4s ease 0.1s;
    }
    .info-panel .country-sub.visible { opacity: 1; }

    .drag-hint {
      position: fixed; bottom: 6rem; left: 50%; transform: translateX(-50%);
      z-index: 100; text-align: center;
      color: rgba(245,240,232,0.4); font-size: 0.75rem; letter-spacing: 0.12em;
      text-transform: uppercase; pointer-events: none;
      animation: fadeHint 3s ease 2s forwards;
    }
    @keyframes fadeHint { 0% { opacity: 1; } 100% { opacity: 0; } }

    .zola-tooltip {
      position: fixed; z-index: 200;
      background: rgba(27,67,50,0.95);
      border: 1px solid rgba(184,134,11,0.5);
      border-radius: 12px; padding: 0.75rem 1.25rem;
      color: #F5F0E8; font-size: 0.82rem; max-width: 220px;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .zola-tooltip.visible { opacity: 1; }
    .zola-tooltip strong { color: #B8860B; display: block; margin-bottom: 0.25rem; font-size: 0.9rem; }

    #loading {
      position: fixed; inset: 0; z-index: 500; background: #020408;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
      transition: opacity 0.8s ease;
    }
    #loading .loading-logo { font-size: 1.5rem; color: #F5F0E8; letter-spacing: 0.1em; }
    #loading .loading-sub { font-size: 0.75rem; color: #B8860B; letter-spacing: 0.2em; text-transform: uppercase; }
    #loading .loading-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    #loading .loading-fill { height: 100%; background: linear-gradient(90deg, #1B4332, #B8860B); border-radius: 2px; width: 0%; transition: width 0.05s linear; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="loading-logo">PALM LEAF PARTNERS</div>
    <div class="loading-sub">Loading Our World</div>
    <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  </div>

  <div class="top-bar">
    <a href="../index.html" class="logo">
      <img src="../assets/images/plp-logo-nav.png" alt="Palm Leaf Partners" />
      <div class="logo-text">
        <div class="name">PALM LEAF</div>
        <div class="sub">— PARTNERS —</div>
      </div>
    </a>
    <a href="../index.html" class="back-btn">← Back to Site</a>
  </div>

  <div id="canvas-container"></div>

  <div class="info-panel">
    <div class="country-name" id="country-name"></div>
    <div class="country-sub" id="country-sub"></div>
  </div>

  <div class="drag-hint">Drag to rotate · Scroll to zoom</div>

  <div class="zola-tooltip" id="zola-tooltip">
    <strong>Zola · DRC</strong>
    Building Systems. Growing Futures.
  </div>

  <script src="../js/vendor/three.min.js"></script>
  <script src="../js/vendor/OrbitControls.js"></script>

  <script>
  (function() {

    // ── Loading ──
    const fill = document.getElementById('loading-fill');
    let prog = 0;
    const loadInt = setInterval(() => {
      prog = Math.min(prog + Math.random() * 12, 95);
      fill.style.width = prog + '%';
    }, 80);
    function finishLoad() {
      clearInterval(loadInt);
      fill.style.width = '100%';
      setTimeout(() => {
        const el = document.getElementById('loading');
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 800);
      }, 300);
    }

    // ── Renderer ──
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 3.2);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.5;
    controls.minDistance = 1.8;
    controls.maxDistance = 6;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    // ── Stars ──
    const starPos = new Float32Array(10000 * 3);
    for (let i = 0; i < starPos.length; i++) starPos[i] = (Math.random() - 0.5) * 500;
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.75 })));

    // ── Lights ──
    scene.add(new THREE.AmbientLight(0x223344, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e0, 2.0);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    // ── Geo coordinate system ──
    // Converts lat/lon to a unit vector in Three.js coordinate space
    // Three.js: Y=up, Z=toward camera, X=right
    // Standard geographic: lat 0 lon 0 = (0,0,1) facing camera
    function geoToVec3(lat, lon, r) {
      const phi   = (90 - lat) * Math.PI / 180;  // polar angle from Y-up
      const theta = lon        * Math.PI / 180;   // azimuth from Z-axis
      return new THREE.Vector3(
        r * Math.sin(phi) * Math.sin(theta),   // X
        r * Math.cos(phi),                      // Y
        r * Math.sin(phi) * Math.cos(theta)    // Z
      );
    }

    // ── Globe ──
    const loader = new THREE.TextureLoader();
    const globeGeo = new THREE.SphereGeometry(1, 64, 64);
    const globeMat = new THREE.MeshPhongMaterial({
      map:         loader.load('../assets/textures/earth_day.jpg'),
      bumpMap:     loader.load('../assets/textures/earth_bump.jpg'),
      bumpScale:   0.015,
      specularMap: loader.load('../assets/textures/earth_spec.jpg'),
      specular:    new THREE.Color(0x333333),
      shininess:   12
    });
    const globe = new THREE.Mesh(globeGeo, globeMat);
    scene.add(globe);

    // Atmosphere
    const atmMat = new THREE.MeshPhongMaterial({ color: 0x4488ff, transparent: true, opacity: 0.07, side: THREE.FrontSide });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.02, 64, 64), atmMat));
    const glowMat = new THREE.MeshPhongMaterial({ color: 0x2255aa, transparent: true, opacity: 0.04, side: THREE.BackSide });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.08, 64, 64), glowMat));

    // ── Pin system — geo-coordinate based ──
    // Each pin has: lat, lon, label, sublabel, color, sprite (optional)
    const PINS = [
      { lat: -4,  lon: 24,  label: 'Democratic Republic of Congo', sub: 'Palm Leaf Partners · Active',  color: 0xB8860B, sprite: '../assets/images/zola-globe-sprite.png', active: true  },
      { lat:  9,  lon:  8,  label: 'Nigeria',                      sub: 'Coming Soon',                  color: 0x40916C, sprite: null, active: false },
      { lat:  7,  lon: -1,  label: 'Ghana',                        sub: 'Coming Soon',                  color: 0x40916C, sprite: null, active: false },
      { lat: -1,  lon: 37,  label: 'Kenya',                        sub: 'Coming Soon',                  color: 0x40916C, sprite: null, active: false },
      { lat: -29, lon: 25,  label: 'South Africa',                 sub: 'Coming Soon',                  color: 0x40916C, sprite: null, active: false },
    ];

    // For each pin, store the local unit vector (relative to unrotated globe)
    PINS.forEach(pin => {
      pin.localDir = geoToVec3(pin.lat, pin.lon, 1.0).normalize();

      // Glow dot — child of globe so it rotates with it
      const glowMesh = new THREE.Mesh(
        new THREE.SphereGeometry(pin.active ? 0.075 : 0.025, 16, 16),
        new THREE.MeshBasicMaterial({ color: pin.color, transparent: true, opacity: pin.active ? 0.7 : 0.5 })
      );
      glowMesh.position.copy(geoToVec3(pin.lat, pin.lon, 1.005));
      globe.add(glowMesh);
      pin.glowMesh = glowMesh;
      pin.glowMat  = glowMesh.material;

      // Pulse ring for active pin
      if (pin.active) {
        const ringMesh = new THREE.Mesh(
          new THREE.RingGeometry(0.085, 0.11, 32),
          new THREE.MeshBasicMaterial({ color: pin.color, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
        );
        ringMesh.position.copy(geoToVec3(pin.lat, pin.lon, 1.006));
        ringMesh.lookAt(new THREE.Vector3(0, 0, 0));
        globe.add(ringMesh);
        pin.ringMesh = ringMesh;
        pin.ringMat  = ringMesh.material;
      }

      // Sprite (Zola or future sisters)
      if (pin.sprite) {
        const spriteMat = new THREE.SpriteMaterial({
          map: loader.load(pin.sprite),
          transparent: true,
          depthTest: false,  // we handle visibility manually
          opacity: 0
        });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(0.22, 0.38, 1);
        scene.add(sprite);  // world space — we position it each frame
        pin.spriteMesh = sprite;
        pin.spriteMat  = spriteMat;
      }
    });

    // ── Raycaster ──
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('zola-tooltip');
    const countryName = document.getElementById('country-name');
    const countrySub  = document.getElementById('country-sub');

    const drcPin = PINS.find(p => p.active);

    function onPointerMove(e) {
      const x = e.clientX ?? e.touches?.[0]?.clientX;
      const y = e.clientY ?? e.touches?.[0]?.clientY;
      if (x == null) return;
      mouse.x =  (x / window.innerWidth)  * 2 - 1;
      mouse.y = -(y / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = drcPin.spriteMesh ? raycaster.intersectObject(drcPin.spriteMesh) : [];

      if (hits.length > 0 && drcPin.spriteMat.opacity > 0.5) {
        tooltip.style.left = (x + 20) + 'px';
        tooltip.style.top  = (y - 60) + 'px';
        tooltip.classList.add('visible');
        countryName.textContent = drcPin.label;
        countryName.classList.add('visible');
        countrySub.textContent = drcPin.sub;
        countrySub.classList.add('visible');
        controls.autoRotate = false;
        document.body.style.cursor = 'pointer';
      } else {
        tooltip.classList.remove('visible');
        countryName.classList.remove('visible');
        countrySub.classList.remove('visible');
        controls.autoRotate = true;
        document.body.style.cursor = 'grab';
      }
    }
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('touchmove', onPointerMove, { passive: true });

    window.addEventListener('click', (e) => {
      mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      if (drcPin.spriteMesh && raycaster.intersectObject(drcPin.spriteMesh).length > 0) {
        window.location.href = '../index.html';
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Animation ──
    const _v3 = new THREE.Vector3();
    const _quat = new THREE.Quaternion();
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;
      controls.update();

      // Get globe's current world quaternion
      globe.getWorldQuaternion(_quat);

      PINS.forEach(pin => {
        // Transform pin's local direction to world space using globe's rotation
        _v3.copy(pin.localDir).applyQuaternion(_quat);

        // Visibility: dot product with camera forward (0,0,-1 in camera space)
        // In world space, camera looks toward origin from +Z
        // So facing = _v3.z (positive = facing camera)
        const facing = _v3.z;
        const vis = Math.max(0, Math.min(1, facing * 6 + 0.2));

        // Update glow opacity
        if (pin.glowMat) pin.glowMat.opacity = vis * (pin.active ? 0.7 : 0.5);

        // Pulse for active pin
        if (pin.active) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);
          if (pin.glowMesh) pin.glowMesh.scale.setScalar(0.9 + 0.2 * pulse);
          if (pin.ringMat)  pin.ringMat.opacity = vis * (0.4 + 0.4 * pulse);
          if (pin.ringMesh) pin.ringMesh.scale.setScalar(1 + 0.15 * pulse);
        }

        // Position and fade sprite
        if (pin.spriteMesh && pin.spriteMat) {
          const floatY = pin.active ? Math.sin(t * 1.2) * 0.008 : 0;
          pin.spriteMesh.position.copy(_v3).multiplyScalar(1.28 + floatY);
          pin.spriteMat.opacity = vis;
        }
      });

      renderer.render(scene, camera);
    }

    // Start
    finishLoad();
    animate();

  })();
  </script>
</body>
</html>
