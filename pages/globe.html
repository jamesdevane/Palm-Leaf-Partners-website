<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Our World — Palm Leaf Partners</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020408; font-family: 'Georgia', serif; }
    #canvas-container { position: fixed; inset: 0; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      background: linear-gradient(to bottom, rgba(2,4,8,0.9) 0%, rgba(2,4,8,0) 100%);
    }
    .top-bar .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .top-bar .logo img { height: 40px; width: 40px; border-radius: 50%; }
    .top-bar .logo-text .name { font-size: 1rem; font-weight: 700; color: #F5F0E8; letter-spacing: 0.05em; display: block; }
    .top-bar .logo-text .sub { font-size: 0.6rem; color: #B8860B; letter-spacing: 0.18em; text-transform: uppercase; display: block; }
    .top-bar .back-btn {
      color: rgba(245,240,232,0.7); font-size: 0.82rem; font-weight: 500;
      text-decoration: none; border: 1px solid rgba(184,134,11,0.4);
      padding: 0.4rem 1rem; border-radius: 20px; transition: all 0.2s;
    }
    .top-bar .back-btn:hover { color: #B8860B; border-color: #B8860B; }

    /* Kinshasa time clock */
    .kinshasa-clock {
      position: fixed; top: 5rem; right: 2rem; z-index: 100;
      text-align: right; pointer-events: none;
    }
    .kinshasa-clock .clock-label {
      font-size: 0.65rem; color: rgba(184,134,11,0.7);
      letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.2rem;
    }
    .kinshasa-clock .clock-time {
      font-size: 1.4rem; font-weight: 700; color: #F5F0E8;
      font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }
    .kinshasa-clock .clock-date {
      font-size: 0.72rem; color: rgba(245,240,232,0.5); margin-top: 0.1rem;
    }

    .info-panel {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 100; text-align: center; pointer-events: none;
    }
    .info-panel .country-name {
      font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; color: #F5F0E8;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      opacity: 0; transform: translateY(10px); transition: all 0.4s ease;
    }
    .info-panel .country-name.visible { opacity: 1; transform: translateY(0); }
    .info-panel .country-sub {
      font-size: 0.8rem; color: #B8860B; letter-spacing: 0.15em;
      text-transform: uppercase; margin-top: 0.25rem;
      opacity: 0; transition: all 0.4s ease 0.1s;
    }
    .info-panel .country-sub.visible { opacity: 1; }

    .drag-hint {
      position: fixed; bottom: 6rem; left: 50%; transform: translateX(-50%);
      z-index: 100; color: rgba(245,240,232,0.35); font-size: 0.72rem;
      letter-spacing: 0.12em; text-transform: uppercase; pointer-events: none;
      animation: fadeHint 3s ease 2.5s forwards;
    }
    @keyframes fadeHint { 0%{opacity:1} 100%{opacity:0} }

    .zola-tooltip {
      position: fixed; z-index: 200;
      background: rgba(27,67,50,0.95); border: 1px solid rgba(184,134,11,0.5);
      border-radius: 12px; padding: 0.75rem 1.25rem;
      color: #F5F0E8; font-size: 0.82rem; max-width: 220px;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .zola-tooltip.visible { opacity: 1; }
    .zola-tooltip strong { color: #B8860B; display: block; margin-bottom: 0.25rem; font-size: 0.9rem; }

    #loading {
      position: fixed; inset: 0; z-index: 500; background: #020408;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
      transition: opacity 0.8s ease;
    }
    #loading .ll { font-size: 1.5rem; color: #F5F0E8; letter-spacing: 0.1em; }
    #loading .ls { font-size: 0.75rem; color: #B8860B; letter-spacing: 0.2em; text-transform: uppercase; }
    #loading .lb { width: 200px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    #loading .lf { height: 100%; background: linear-gradient(90deg, #1B4332, #B8860B); width: 0%; transition: width 0.05s; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="ll">PALM LEAF PARTNERS</div>
    <div class="ls">Loading Our World</div>
    <div class="lb"><div class="lf" id="lf"></div></div>
  </div>

  <div class="top-bar">
    <a href="../index.html" class="logo">
      <img src="../assets/images/plp-logo-nav.png" alt="Palm Leaf Partners" />
      <div class="logo-text">
        <span class="name">PALM LEAF</span>
        <span class="sub">— PARTNERS —</span>
      </div>
    </a>
    <a href="../index.html" class="back-btn">← Back to Site</a>
  </div>

  <!-- Kinshasa clock -->
  <div class="kinshasa-clock">
    <div class="clock-label">Kinshasa, DRC · UTC+2</div>
    <div class="clock-time" id="clock-time">--:--:--</div>
    <div class="clock-date" id="clock-date"></div>
  </div>

  <div id="canvas-container"></div>

  <div class="info-panel">
    <div class="country-name" id="country-name"></div>
    <div class="country-sub" id="country-sub"></div>
  </div>

  <div class="drag-hint">Drag to rotate · Scroll to zoom</div>

  <div class="zola-tooltip" id="zola-tooltip">
    <strong>Zola · DRC</strong>
    Building Systems. Growing Futures.
  </div>

  <script src="../js/vendor/three.min.js"></script>
  <script src="../js/vendor/OrbitControls.js"></script>

  <script>
  (function() {

    // ── Kinshasa clock (UTC+2) ──
    function updateClock() {
      const now = new Date();
      const kin = new Date(now.getTime() + (2 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
      const h = String(kin.getHours()).padStart(2,'0');
      const m = String(kin.getMinutes()).padStart(2,'0');
      const s = String(kin.getSeconds()).padStart(2,'0');
      document.getElementById('clock-time').textContent = `${h}:${m}:${s}`;
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('clock-date').textContent =
        `${days[kin.getDay()]}, ${months[kin.getMonth()]} ${kin.getDate()}, ${kin.getFullYear()}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Loading ──
    const lf = document.getElementById('lf');
    let prog = 0;
    const li = setInterval(() => { prog = Math.min(prog + Math.random()*12, 95); lf.style.width = prog+'%'; }, 80);
    function finishLoad() {
      clearInterval(li); lf.style.width = '100%';
      setTimeout(() => { const el=document.getElementById('loading'); el.style.opacity='0'; setTimeout(()=>el.remove(),800); }, 300);
    }

    // ── Renderer ──
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 3.2);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.5; controls.minDistance = 1.8; controls.maxDistance = 6;
    controls.enablePan = false; controls.autoRotate = true; controls.autoRotateSpeed = 0.35;

    // ── Stars ──
    const sp = new Float32Array(10000*3);
    for(let i=0;i<sp.length;i++) sp[i]=(Math.random()-0.5)*500;
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
    scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff,size:0.12,transparent:true,opacity:0.7})));

    // ── Lights ──
    // Ambient (dim blue-black for night side)
    scene.add(new THREE.AmbientLight(0x111122, 0.3));

    // Sun — positioned based on current UTC time (solar noon at lon 0 = 12:00 UTC)
    const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.2);
    // Calculate sun angle: at UTC 12:00, sun is at lon 0. Each hour = 15 degrees west.
    const utcHours = new Date().getUTCHours() + new Date().getUTCMinutes()/60;
    const sunLon = (12 - utcHours) * 15; // degrees east
    const sunPhi = 90 * Math.PI / 180; // sun at equator (simplified)
    const sunTheta = sunLon * Math.PI / 180;
    sunLight.position.set(
      5 * Math.sin(sunPhi) * Math.sin(sunTheta),
      5 * Math.cos(sunPhi) * 0.3, // slight tilt for realism
      5 * Math.sin(sunPhi) * Math.cos(sunTheta)
    );
    scene.add(sunLight);

    // ── Geo coordinate system ──
    // Three.js SphereGeometry UV mapping:
    // The texture wraps with lon -180 at u=0 (left) and lon +180 at u=1 (right)
    // At globe.rotation.y = 0, the SEAM (lon -180/+180) faces camera
    // So lon 0 (Greenwich) is at the BACK of the globe at rotation.y = 0
    // To convert lat/lon to 3D: we use the standard spherical formula
    // but must account for the fact that lon 0 = Z- (back) at rotation.y=0
    // Therefore: lon 0 → Z-, lon 90E → X+, lon 90W → X-, lon 180 → Z+
    function geoToLocal(lat, lon, r) {
      const phi   = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180; // shift so lon -180=0, lon 0=PI, lon 180=2PI
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.sin(theta),  // X
         r * Math.cos(phi),                     // Y
        -r * Math.sin(phi) * Math.cos(theta)   // Z (negative because lon 0 = back)
      );
    }

    // ── Globe ──
    const loader = new THREE.TextureLoader();
    const globeGeo = new THREE.SphereGeometry(1, 64, 64);
    const globeMat = new THREE.MeshPhongMaterial({
      map:         loader.load('../assets/textures/earth_day.jpg'),
      bumpMap:     loader.load('../assets/textures/earth_bump.jpg'),
      bumpScale:   0.015,
      specularMap: loader.load('../assets/textures/earth_spec.jpg'),
      specular:    new THREE.Color(0x222222),
      shininess:   8
    });
    const globe = new THREE.Mesh(globeGeo, globeMat);
    // No rotation needed — geoToLocal handles the coordinate mapping
    scene.add(globe);

    // Night side overlay (dark hemisphere)
    const nightGeo = new THREE.SphereGeometry(1.001, 64, 64);
    const nightMat = new THREE.MeshBasicMaterial({
      color: 0x000011, transparent: true, opacity: 0.55,
      side: THREE.FrontSide
    });
    // We'll rotate the night overlay to match sun position each frame
    const nightOverlay = new THREE.Mesh(nightGeo, nightMat);
    scene.add(nightOverlay);

    // Atmosphere
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.02,64,64),
      new THREE.MeshPhongMaterial({color:0x4488ff,transparent:true,opacity:0.07,side:THREE.FrontSide})));
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.08,64,64),
      new THREE.MeshPhongMaterial({color:0x2255aa,transparent:true,opacity:0.04,side:THREE.BackSide})));

    // ── Pin system ──
    const PINS = [
      { lat: -4,  lon: 24,  label: 'Democratic Republic of Congo', sub: 'Palm Leaf Partners · Active',  color: 0xB8860B, sprite: '../assets/images/zola-globe-sprite.png', active: true  },
      { lat:  9,  lon:  8,  label: 'Nigeria',      sub: 'Coming Soon', color: 0x40916C, sprite: null, active: false },
      { lat:  7,  lon: -1,  label: 'Ghana',         sub: 'Coming Soon', color: 0x40916C, sprite: null, active: false },
      { lat: -1,  lon: 37,  label: 'Kenya',         sub: 'Coming Soon', color: 0x40916C, sprite: null, active: false },
      { lat: -29, lon: 25,  label: 'South Africa',  sub: 'Coming Soon', color: 0x40916C, sprite: null, active: false },
    ];

    PINS.forEach(pin => {
      pin.localDir = geoToLocal(pin.lat, pin.lon, 1.0).normalize();

      const glowMesh = new THREE.Mesh(
        new THREE.SphereGeometry(pin.active ? 0.075 : 0.025, 16, 16),
        new THREE.MeshBasicMaterial({ color: pin.color, transparent: true, opacity: 0 })
      );
      glowMesh.position.copy(geoToLocal(pin.lat, pin.lon, 1.005));
      globe.add(glowMesh);
      pin.glowMesh = glowMesh; pin.glowMat = glowMesh.material;

      if (pin.active) {
        const ringMesh = new THREE.Mesh(
          new THREE.RingGeometry(0.085, 0.11, 32),
          new THREE.MeshBasicMaterial({ color: pin.color, transparent: true, opacity: 0, side: THREE.DoubleSide })
        );
        ringMesh.position.copy(geoToLocal(pin.lat, pin.lon, 1.006));
        ringMesh.lookAt(new THREE.Vector3(0,0,0));
        globe.add(ringMesh);
        pin.ringMesh = ringMesh; pin.ringMat = ringMesh.material;
      }

      if (pin.sprite) {
        const spriteMat = new THREE.SpriteMaterial({
          map: loader.load(pin.sprite), transparent: true, depthTest: false, opacity: 0
        });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(0.22, 0.38, 1);
        scene.add(sprite);
        pin.spriteMesh = sprite; pin.spriteMat = spriteMat;
      }
    });

    // ── Raycaster ──
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('zola-tooltip');
    const cName = document.getElementById('country-name');
    const cSub  = document.getElementById('country-sub');
    const drcPin = PINS.find(p => p.active);

    function onPtr(e) {
      const x = e.clientX ?? e.touches?.[0]?.clientX;
      const y = e.clientY ?? e.touches?.[0]?.clientY;
      if (x==null) return;
      mouse.x = (x/window.innerWidth)*2-1;
      mouse.y = -(y/window.innerHeight)*2+1;
      raycaster.setFromCamera(mouse, camera);
      const hits = drcPin.spriteMesh ? raycaster.intersectObject(drcPin.spriteMesh) : [];
      if (hits.length > 0 && drcPin.spriteMat.opacity > 0.5) {
        tooltip.style.left=(x+20)+'px'; tooltip.style.top=(y-60)+'px';
        tooltip.classList.add('visible');
        cName.textContent=drcPin.label; cName.classList.add('visible');
        cSub.textContent=drcPin.sub; cSub.classList.add('visible');
        controls.autoRotate=false; document.body.style.cursor='pointer';
      } else {
        tooltip.classList.remove('visible');
        cName.classList.remove('visible'); cSub.classList.remove('visible');
        controls.autoRotate=true; document.body.style.cursor='grab';
      }
    }
    window.addEventListener('mousemove', onPtr);
    window.addEventListener('touchmove', onPtr, {passive:true});
    window.addEventListener('click', e => {
      mouse.x=(e.clientX/window.innerWidth)*2-1;
      mouse.y=-(e.clientY/window.innerHeight)*2+1;
      raycaster.setFromCamera(mouse,camera);
      if(drcPin.spriteMesh && raycaster.intersectObject(drcPin.spriteMesh).length>0)
        window.location.href='../index.html';
    });
    window.addEventListener('resize', () => {
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });

    // ── Animation ──
    const _v3 = new THREE.Vector3();
    const _quat = new THREE.Quaternion();
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;
      controls.update();
      globe.getWorldQuaternion(_quat);

      // Update sun position (slow real-time drift)
      const utcNow = new Date().getUTCHours() + new Date().getUTCMinutes()/60 + new Date().getUTCSeconds()/3600;
      const sLon = (12 - utcNow) * 15;
      const sTheta = sLon * Math.PI / 180;
      sunLight.position.set(
        5 * Math.sin(sTheta),
        1.5,
        5 * Math.cos(sTheta)
      );

      // Night overlay: rotate to always cover the hemisphere away from sun
      nightOverlay.rotation.y = -sTheta;

      PINS.forEach(pin => {
        _v3.copy(pin.localDir).applyQuaternion(_quat);

        // Visibility: _v3.z > 0 means facing camera (camera at +Z)
        // Use a sharp cutoff at the horizon (z=0) with a small feather zone
        const vis = Math.max(0, Math.min(1, _v3.z * 8)); // sharp fade

        if (pin.glowMat) pin.glowMat.opacity = vis * (pin.active ? 0.7 : 0.5);

        if (pin.active) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);
          if (pin.glowMesh) pin.glowMesh.scale.setScalar(0.9 + 0.2 * pulse);
          if (pin.ringMat)  pin.ringMat.opacity = vis * (0.4 + 0.4 * pulse);
          if (pin.ringMesh) pin.ringMesh.scale.setScalar(1 + 0.15 * pulse);
        }

        if (pin.spriteMesh && pin.spriteMat) {
          const floatY = pin.active ? Math.sin(t * 1.2) * 0.008 : 0;
          pin.spriteMesh.position.copy(_v3).multiplyScalar(1.28 + floatY);
          pin.spriteMat.opacity = vis; // sharp disappear at horizon
        }
      });

      renderer.render(scene, camera);
    }

    finishLoad();
    animate();

  })();
  </script>
</body>
</html>
